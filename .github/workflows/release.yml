name: Lighting OS Release Bot

on:
  workflow_dispatch:
    inputs:
      device_codename:
        description: 'Device Codename (e.g. cheetah)'
        required: true
        type: string
      rom_version:
        description: 'ROM Version (e.g. 1.0)'
        required: true
        type: string
      build_date:
        description: 'Build Date (YYYYMMDD)'
        required: true
        type: string
        default: '20260915'
      maintainer_name:
        description: 'Maintainer Name'
        required: true
        type: string
      banner_url_option:
        description: 'Override Banner URL (optional, leaves blank to use default secret)'
        required: false
        type: string
      download_url:
        description: 'Download Link (Gofile, etc.)'
        required: true
        type: string
      changelog_url:
        description: 'Changelog Link (GitHub commit or Telegra.ph)'
        required: true
        type: string
      support_url:
        description: 'Telegram Support Chat URL'
        required: true
        type: string
        default: 'https://t.me/LightningOSchat'
      forum_url:
        description: 'XDA Forum URL'
        required: true
        type: string
      guide_url:
        description: 'Installation Guide URL'
        required: true
        type: string
      md5_hash:
        description: 'MD5 Checksum'
        required: true
        type: string

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install requests

      - name: Run Bot Script
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          BANNER_IMAGE_URL: ${{ inputs.banner_url_option != '' && inputs.banner_url_option || secrets.BANNER_IMAGE_URL }}
          VERSION: ${{ inputs.rom_version }}
          DEVICE: ${{ inputs.device_codename }}
          BUILD_DATE: ${{ inputs.build_date }}
          MAINTAINER: ${{ inputs.maintainer_name }}
          DOWNLOAD_URL: ${{ inputs.download_url }}
          CHANGELOG_URL: ${{ inputs.changelog_url }}
          SUPPORT_URL: ${{ inputs.support_url }}
          FORUM_URL: ${{ inputs.forum_url }}
          GUIDE_URL: ${{ inputs.guide_url }}
          MD5: ${{ inputs.md5_hash }}
        run: python release_bot.py
