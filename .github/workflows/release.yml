name: Lighting OS Release Bot

on:
  workflow_dispatch:
    inputs:
      device_codename:
        description: 'Device Codename (e.g. cheetah)'
        required: true
        type: string
      rom_version:
        description: 'ROM Version (e.g. 1.0)'
        required: true
        type: string
      build_type:
        description: 'Build Variant (GAPPS or Vanilla)'
        required: true
        type: choice
        options:
          - GAPPS
          - Vanilla
        default: 'GAPPS'
      build_date:
        description: 'Build Date (YYYYMMDD)'
        required: true
        type: string
        default: '20260915'
      maintainer_name:
        description: 'Maintainer Name'
        required: true
        type: string
      download_url:
        description: 'Download Link (Gofile, etc.)'
        required: true
        type: string
      changelog_url:
        description: 'Main Changelog Link'
        required: true
        type: string
      rom_changelog:
        description: 'ROM Changelog Link (optional)'
        required: false
        type: string
      device_changelog:
        description: 'Device Changelog Link (optional)'
        required: false
        type: string
      support_url:
        description: 'Telegram Support Chat URL'
        required: true
        type: string
        default: 'https://t.me/LightningOSchat'
      guide_url:
        description: 'Installation Guide URL'
        required: true
        type: string
      md5_hash:
        description: 'MD5 Checksum'
        required: true
        type: string

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install requests

      - name: Run Bot Script
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          BANNER_IMAGE_URL: ${{ secrets.BANNER_IMAGE_URL }}
          VERSION: ${{ inputs.rom_version }}
          DEVICE: ${{ inputs.device_codename }}
          BUILD_TYPE: ${{ inputs.build_type }}
          BUILD_DATE: ${{ inputs.build_date }}
          MAINTAINER: ${{ inputs.maintainer_name }}
          DOWNLOAD_URL: ${{ inputs.download_url }}
          CHANGELOG_URL: ${{ inputs.changelog_url }}
          ROM_CHANGELOG: ${{ inputs.rom_changelog }}
          DEVICE_CHANGELOG: ${{ inputs.device_changelog }}
          SUPPORT_URL: ${{ inputs.support_url }}
          GUIDE_URL: ${{ inputs.guide_url }}
          MD5: ${{ inputs.md5_hash }}
        run: python release_bot.py
